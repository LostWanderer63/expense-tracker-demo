<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Expense Tracker</title>
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
  <main class="auth-card">
    <section id="loginView">
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Log in to track your expenses</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Enter your email</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required />
        <small class="error" data-for="email"></small>
      </div>

      <div class="field">
        <label for="password">Enter your password</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Your password" required />
          <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password">Show</button>
        </div>
        <small class="error" data-for="password"></small>
      </div>

      <button type="submit" class="btn" id="loginBtn">Login</button>
      <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
    </form>

    <button type="button" class="link-btn" id="forgotLink">Forgot password?</button>

    <div class="divider">New user?</div>
    <a href="../signup/signup.html" class="btn-secondary">Signup</a>
    </section>

    <section id="forgotView" class="hidden">
      <h1 class="auth-title">Forgot password</h1>
      <p class="auth-subtitle">Enter your account email and we'll send you a link to reset your password.</p>

      <form id="forgotForm" novalidate>
        <div class="field">
          <label for="forgotEmail">Email</label>
          <input type="email" id="forgotEmail" name="email" autocomplete="email" placeholder="you@example.com" required />
          <small class="error" data-for="forgotEmail"></small>
        </div>

        <button type="submit" class="btn" id="forgotBtn">Send reset link</button>
        <p class="form-message" id="forgotMessage" role="status" aria-live="polite"></p>
      </form>

      <button type="button" class="link-btn" id="backToLogin">← Back to login</button>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
  <script src="login.js"></script>
</body>
</html>
